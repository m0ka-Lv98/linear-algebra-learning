name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      course:
        description: 'Course ID (e.g. 00)'
        required: false
        type: string
      topic:
        description: 'Topic implementation ID'
        required: false
        type: string
      full:
        description: 'Force full build'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: slides-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/slides
          key: slidev-${{ hashFiles('pnpm-lock.yaml', 'apps/slides/package.json') }}-${{ github.sha }}
          restore-keys: |
            slidev-${{ hashFiles('pnpm-lock.yaml', 'apps/slides/package.json') }}-
      - name: Build site
        env:
          COURSE: ${{ inputs.course }}
          TOPIC: ${{ inputs.topic }}
          FULL: ${{ inputs.full }}
          CACHE_MATCHED: ${{ steps.slides-cache.outputs.cache-matched-key }}
        run: |
          if [ "$FULL" = "true" ] || [ -z "$CACHE_MATCHED" ]; then
            echo "build mode: Course 00 only (cache miss or full requested)"
            BASE_PATH=/linear-algebra-learning/ pnpm build:incremental -- --course 00
          elif [ -n "$COURSE" ]; then
            echo "build mode: incremental course=$COURSE"
            BASE_PATH=/linear-algebra-learning/ pnpm build:incremental -- --course "$COURSE"
          elif [ -n "$TOPIC" ]; then
            echo "build mode: incremental topic=$TOPIC"
            BASE_PATH=/linear-algebra-learning/ pnpm build:incremental -- --topic "$TOPIC"
          else
            echo "build mode: incremental auto"
            BASE_PATH=/linear-algebra-learning/ pnpm build:incremental -- --auto
          fi
      - name: Verify slide completeness
        run: node tools/verify-slide-build.mjs
      - uses: actions/cache/save@v4
        if: success() && steps.slides-cache.outputs.cache-primary-key != steps.slides-cache.outputs.cache-matched-key
        with:
          path: dist/slides
          key: slidev-${{ hashFiles('pnpm-lock.yaml', 'apps/slides/package.json') }}-${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
