name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      course:
        description: 'Course ID (e.g. 00)'
        required: false
        type: string
      topic:
        description: 'Topic implementation ID'
        required: false
        type: string
      courses_01_10:
        description: 'Rebuild Course 01-10 only; preserve cached Course 00'
        required: false
        default: false
        type: boolean
      full:
        description: 'Force full build'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build site
        run: |
          set -euo pipefail
          rm -rf dist
          BASE_PATH=/linear-algebra-learning/ pnpm build:portal
          mkdir -p dist
          cp -R apps/portal/.vitepress/dist/. dist/
      - name: Audit learning-material quality
        run: node tools/check-learning-quality.mjs
      - name: Assert build did not mutate source files
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- . ':!dist'; then
            echo "ERROR: build mutated repository source files. Build steps must be pure."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
