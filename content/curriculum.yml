topics:
  - id: prep-symbols-types-shapes
    course: "00"
    unit: prep-mathematical-literacy
    order: 10
    title: 数式・記号・型・次元
    summary: 数式・記号・型・次元の定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites: []
    implementation_topic: prep-symbols-types-shapes
    outcomes:
      - スカラー、ベクトル、行列、テンソル、型、次元、shapeの定義と成立条件を説明できる
      - 数式・記号・型・次元を小規模に計算・実装し検算できる
  - id: prep-sets-functions-mappings
    course: "00"
    unit: prep-mathematical-literacy
    order: 20
    title: 集合・関数・写像
    summary: 集合・関数・写像の定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-symbols-types-shapes
    implementation_topic: prep-sets-functions-mappings
    outcomes:
      - 集合、要素、部分集合、関数、定義域、終域、値域、合成の定義と成立条件を説明できる
      - 集合・関数・写像を小規模に計算・実装し検算できる
  - id: prep-sums-products-indices
    course: "00"
    unit: prep-mathematical-literacy
    order: 30
    title: 総和・積・添字
    summary: 総和・積・添字の定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-symbols-types-shapes
    implementation_topic: prep-sums-products-indices
    outcomes:
      - 総和記号、積記号、添字、自由添字、総和添字、二重和の定義と成立条件を説明できる
      - 総和・積・添字を小規模に計算・実装し検算できる
  - id: prep-exponents-logarithms
    course: "00"
    unit: prep-mathematical-literacy
    order: 40
    title: 指数と対数
    summary: 指数と対数の定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-symbols-types-shapes
    implementation_topic: prep-exponents-logarithms
    outcomes:
      - 指数法則、指数関数、対数、底、自然対数、逆関数の定義と成立条件を説明できる
      - 指数と対数を小規模に計算・実装し検算できる
  - id: prep-trigonometry-radians-unit-circle
    course: "00"
    unit: prep-mathematical-literacy
    order: 50
    title: 三角関数・ラジアン・単位円
    summary: 単位円上の点を角度で動かすと、横座標が cos、縦座標が sin になる。ラジアンは円弧長そのものなので、微小角と微小変位を同じ尺度で比較できる。
    status: draft
    kind: required
    prerequisites:
      - prep-exponents-logarithms
    outcomes:
      - 角度をラジアンで測ると、なぜ微積分の三角関数公式が自然な形になるのか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: prep-trigonometry-radians-unit-circle
  - id: prep-absolute-values-inequalities-intervals
    course: "00"
    unit: prep-mathematical-literacy
    order: 60
    title: 絶対値・不等式・区間
    summary: "|x-a| は実数直線上で x と a の距離。したがって |x-a|<r は「a から距離 r 未満」の区間を表す。極限の ε–δ 記法にもそのままつながる。"
    status: draft
    kind: required
    prerequisites:
      - prep-symbols-types-shapes
    outcomes:
      - 絶対値を「場合分け」ではなく距離として読むと、不等式はどう整理できるか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: prep-absolute-values-inequalities-intervals
  - id: prep-complex-numbers-euler-form
    course: "00"
    unit: prep-mathematical-literacy
    order: 70
    title: 複素数・極形式・Euler公式
    summary: 複素数 z=a+bi は平面上のベクトルとみなせる。極形式では大きさ r と角度 θ に分け、掛け算が「大きさを掛け、角度を足す」操作になる。Fourier・固有値・振動の共通言語になる。
    status: draft
    kind: required
    prerequisites:
      - prep-trigonometry-radians-unit-circle
      - prep-exponents-logarithms
    outcomes:
      - 複素数の掛け算を、平面上の回転と拡大としてどう読むか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: prep-complex-numbers-euler-form
  - id: prep-sequences-basics
    course: "00"
    unit: prep-mathematical-literacy
    order: 80
    title: 数列・収束の初歩
    summary: 数列は自然数 n を入力して数 a_n を返す関数。極限は「十分後ろの項を全部、目標値の任意に小さい近傍へ入れられる」という主張。
    status: draft
    kind: required
    prerequisites:
      - prep-sums-products-indices
      - prep-absolute-values-inequalities-intervals
    outcomes:
      - 「nを大きくすると近づく」を、数列の収束としてどう厳密に書くか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: prep-sequences-basics
  - id: prep-definitions-theorems-proofs
    course: "00"
    unit: prep-mathematical-literacy
    order: 90
    title: 定義・命題・証明の読み方
    summary: 定義・命題・証明の読み方の定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-sets-functions-mappings
    implementation_topic: prep-definitions-theorems-proofs
    outcomes:
      - 定義、命題、仮定、結論、必要条件、十分条件、反例、証明の定義と成立条件を説明できる
      - 定義・命題・証明の読み方を小規模に計算・実装し検算できる
  - id: prep-python-expressions-functions
    course: "00"
    unit: prep-computing
    order: 100
    title: Pythonの式・変数・関数
    summary: Pythonの式・変数・関数の定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-symbols-types-shapes
    implementation_topic: prep-python-expressions-functions
    outcomes:
      - 式、変数、代入、条件分岐、反復、関数、引数、戻り値の定義と成立条件を説明できる
      - Pythonの式・変数・関数を小規模に計算・実装し検算できる
  - id: prep-numpy-arrays-shapes
    course: "00"
    unit: prep-computing
    order: 110
    title: NumPy配列・shape・indexing
    summary: NumPy配列・shape・indexingの定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-python-expressions-functions
      - prep-symbols-types-shapes
    implementation_topic: prep-numpy-arrays-shapes
    outcomes:
      - NumPy配列、dtype、ndim、shape、indexing、slicing、reshape、axisの定義と成立条件を説明できる
      - NumPy配列・shape・indexingを小規模に計算・実装し検算できる
  - id: prep-numerical-checks-reproducibility
    course: "00"
    unit: prep-computing
    order: 120
    title: 数値検算と再現性
    summary: 数値検算と再現性の定義、計算手順、成立条件を整理し、学習準備の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-numpy-arrays-shapes
    implementation_topic: prep-numerical-checks-reproducibility
    outcomes:
      - 浮動小数点、許容誤差、残差、乱数seed、再現性、検算の定義と成立条件を説明できる
      - 数値検算と再現性を小規模に計算・実装し検算できる
  - id: calc-functions-limits-continuity
    course: "01"
    unit: calc-single-variable
    order: 10
    title: 関数・極限・連続
    summary: 関数・極限・連続の定義、計算手順、成立条件を整理し、微積分の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - prep-sets-functions-mappings
      - prep-exponents-logarithms
    implementation_topic: calc-functions-limits-continuity
    outcomes:
      - 関数、極限、連続の定義と成立条件を説明できる
      - 関数・極限・連続を小規模に計算・実装し検算できる
  - id: calc-derivatives-rates
    course: "01"
    unit: calc-single-variable
    order: 20
    title: 微分と変化率
    summary: 微分と変化率の定義、計算手順、成立条件を整理し、微積分の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - calc-functions-limits-continuity
    implementation_topic: calc-derivatives-rates
    outcomes:
      - 微分、変化率の定義と成立条件を説明できる
      - 微分と変化率を小規模に計算・実装し検算できる
  - id: calc-differentiation-rules-chain-rule
    course: "01"
    unit: calc-single-variable
    order: 30
    title: 微分法則と一変数の連鎖律
    summary: 微分法則と一変数の連鎖律の定義、計算手順、成立条件を整理し、微積分の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - calc-derivatives-rates
    implementation_topic: calc-differentiation-rules-chain-rule
    outcomes:
      - 微分法則、一変数の連鎖律の定義と成立条件を説明できる
      - 微分法則と一変数の連鎖律を小規模に計算・実装し検算できる
  - id: calc-implicit-inverse-functions
    course: "01"
    unit: calc-single-variable
    order: 40
    title: 陰関数微分と逆関数
    summary: F(x,y)=0 で定まる曲線上では y も x に依存して動く。両辺を x で微分すると、y を含む項には連鎖律で y′ が現れ、それを解けば接線の傾きが得られる。
    status: draft
    kind: required
    prerequisites:
      - calc-differentiation-rules-chain-rule
    outcomes:
      - yを明示的に解けない式でも、なぜ dy/dx を計算できるのか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: calc-implicit-inverse-functions
  - id: calc-one-variable-optimization
    course: "01"
    unit: calc-single-variable
    order: 60
    title: 一変数の最適化
    summary: 一変数の最適化の定義、計算手順、成立条件を整理し、微積分の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - calc-differentiation-rules-chain-rule
    implementation_topic: calc-one-variable-optimization
    outcomes:
      - 一変数の最適化の定義と成立条件を説明できる
      - 一変数の最適化を小規模に計算・実装し検算できる
  - id: calc-mean-value-theorem
    course: "01"
    unit: calc-single-variable
    order: 50
    title: 平均値の定理
    summary: 区間の両端を結ぶ割線と平行な接線が途中に存在する、という局所微分と大域変化を結ぶ定理。単調性、誤差評価、収束証明の基礎になる。
    status: draft
    kind: required
    prerequisites:
      - calc-functions-limits-continuity
      - calc-derivatives-rates
    outcomes:
      - 区間全体の平均変化率と、ある一点の瞬間変化率が一致するのはなぜか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: calc-mean-value-theorem
  - id: calc-integrals-fundamental-theorem
    course: "01"
    unit: calc-single-variable
    order: 70
    title: 積分と微積分学の基本定理
    summary: 積分と微積分学の基本定理の定義、計算手順、成立条件を整理し、微積分の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - calc-derivatives-rates
    implementation_topic: calc-integrals-fundamental-theorem
    outcomes:
      - 積分、微積分学の基本定理の定義と成立条件を説明できる
      - 積分と微積分学の基本定理を小規模に計算・実装し検算できる
  - id: calc-taylor-approximation
    course: "01"
    unit: calc-single-variable
    order: 80
    title: Taylor展開と局所近似
    summary: Taylor展開と局所近似の定義、計算手順、成立条件を整理し、微積分の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - calc-differentiation-rules-chain-rule
    implementation_topic: calc-taylor-approximation
    outcomes:
      - Taylor展開、局所近似の定義と成立条件を説明できる
      - Taylor展開と局所近似を小規模に計算・実装し検算できる
  - id: calc-infinite-series-convergence
    course: "01"
    unit: calc-single-variable
    order: 90
    title: 無限級数と収束判定
    summary: 無限級数は「無限に足す操作」を直接定義せず、最初のN項までの部分和 S_N を作り、その数列が収束するかで定義する。
    status: draft
    kind: required
    prerequisites:
      - prep-sequences-basics
      - calc-integrals-fundamental-theorem
    outcomes:
      - 無限個の項を足すとは何を意味し、どの条件で有限値へ収束するのか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: calc-infinite-series-convergence
  - id: calc-taylor-series-remainder
    course: "01"
    unit: calc-single-variable
    order: 100
    title: Taylor級数・剰余・収束半径
    summary: Taylor多項式を高次数へしただけでは自動的に関数へ一致しない。差 R_n(x) が0へ行くことを別に確認する必要がある。
    status: draft
    kind: required
    prerequisites:
      - calc-taylor-approximation
      - calc-infinite-series-convergence
    outcomes:
      - 有限次数のTaylor近似を無限級数へ伸ばすと、いつ元の関数そのものになるのか。
      - 中心式の記号と成立条件を説明できる
      - 小さい例と反例で検算できる
    implementation_topic: calc-taylor-series-remainder
  - id: calc-multivariable-functions-partial-derivatives
    course: "01"
    unit: calc-multivariable
    order: 10
    title: 多変数関数と偏微分
    summary: 多変数関数と偏微分の定義、計算手順、成立条件を整理し、微積分の後続Topicへ接続する
    status: draft
    kind: required
    prerequisites:
      - calc-differentiation-rules-chain-rule
      - prep-symbols-types-shapes
    implementation_topic: calc-multivariable-functions-partial-derivatives
    outcomes:
      - 多変数関数、偏微分の定義と成立条件を説明できる
      - 多変数関数と偏微分を小規模に計算・実装し検算できる
  - id: calc-multiple-integrals
    course: "01"
    unit: calc-multivariable
    order: 90
    title: 重積分
    summary: 領域を小さな長方形や直方体へ分割し、各セルでの関数値×セル面積（体積）を足す。極限を取ると重積分になる。
    status: draft
    kind: required
    prerequisites:
      - calc-integrals-fundamental-theorem
      - calc-multivariable-functions-partial-derivatives
    outcomes:
      - 1変数の「面積の足し上げ」は、2変数・3変数でどのように拡張されるか。
